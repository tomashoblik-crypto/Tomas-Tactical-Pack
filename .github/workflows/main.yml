name: Sestavení APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rozbalit ZIP
        run: unzip -o Tomas_Tactical_Pack.zip

      - name: Nastavit Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Najít a spustit Gradle
        run: |
          GRADLEW=$(find . -name gradlew | head -n 1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Nahrát APK
        uses: actions/upload-artifact@v4
        with:
          name: Tomas-Tactical-Pack-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
